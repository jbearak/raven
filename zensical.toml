# Docs site for https://github.com/jbearak/raven, built from the same
# Markdown files GitHub renders. See "Docs tooling" in docs/development.md.
# Build: uv pip install -r docs/site/requirements.txt && zensical build --strict
# The nav block is generated from docs/user-pages.json by scripts/generate-docs-hub.ts.

[project]
site_name = "Raven"
site_description = "Static analysis and code intelligence for R"
repo_url = "https://github.com/jbearak/raven"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "target/docs-site"
exclude_docs = """
development.md
shared-config-schema.md
diagnostic-corpora.md
package-corpus-checkpoint.md
release-notes-*.md
superpowers/
examples/
site/
user-pages.json
"""

