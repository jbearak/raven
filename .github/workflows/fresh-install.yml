# TEMPORARY: runs scripts/fresh-install-check.sh once on the docs-redesign PR
# to prove docs/getting-started.md works from a fresh install on a machine
# without R. Delete this file before merging; the script stays and is
# documented in docs/development.md ("Docs tooling").
name: Fresh install check

on:
  pull_request:
    paths:
      - ".github/workflows/fresh-install.yml"
      - "scripts/fresh-install-check.sh"
      - "scripts/fresh-install/**"

permissions:
  contents: read

jobs:
  fresh-install:
    name: Tutorial on a fresh install, no R
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Build the raven binary
        run: cargo build --release -p raven

      # Electron needs an X server and a few native libraries. R is
      # deliberately NOT installed.
      - name: Install Xvfb and Electron runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libatk-bridge2.0-0t64 libatk1.0-0t64 libgtk-3-0t64 \
            libasound2t64 libdrm2 libxkbcommon-x11-0 libgbm1 libsecret-1-0 xdg-utils

      - name: Confirm R is absent
        run: |
          if command -v R || [ -x /usr/bin/R ] || [ -x /usr/local/bin/R ]; then
            echo "R is installed on this runner" >&2; exit 1
          fi

      - name: Install VS Code extension dependencies
        working-directory: editors/vscode
        run: npm ci

      - name: Run the fresh-install check
        run: xvfb-run -a scripts/fresh-install-check.sh
