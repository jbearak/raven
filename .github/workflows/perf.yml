name: Performance

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache
  # sccache can't cache incremental units; disable (no benefit in CI). Was set
  # implicitly by dtolnay/rust-toolchain, dropped in favor of rust-toolchain.toml.
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build both revisions before comparing them on the same runner.
  benchmarks:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Check out comparison base
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The push comparison uses the exact prior main commit. PRs use the
          # event's base SHA, never whichever cached main run happened last.
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .perf-base
          persist-credentials: false

      - name: Install the pinned compiler
        # Going through the rustup cargo shim installs rust-toolchain.toml.
        # The comparison script explicitly selects this version for both builds.
        run: cargo --version

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@9e326ebed976843c9932b3aa0e021c6f50310eb4 # v0.0.9

      - name: Cache cargo registry
        id: cargo-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache sccache storage
        id: sccache-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            sccache-${{ runner.os }}-

      - name: Install mold linker
        run: sudo apt-get install -y --no-install-recommends mold

      - name: Reset sccache stats
        run: sccache --zero-stats

      - name: Compare revisions on this runner
        run: |
          python3 scripts/compare-performance.py \
            --base .perf-base --candidate . \
            --output "${{ runner.temp }}/raven-performance" --threshold 5

      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/raven-performance/report.md" ]; then
            cat "${{ runner.temp }}/raven-performance/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Benchmark comparison failed before producing a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-comparison
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/raven-performance/metadata.json
            ${{ runner.temp }}/raven-performance/report.*
            ${{ runner.temp }}/raven-performance/results/
            ${{ runner.temp }}/raven-performance/logs/

      - name: Report cache status
        if: always()
        run: |
          echo "::notice title=Cache status::cargo-hit=${{ steps.cargo-cache.outputs.cache-hit }} sccache-exact-hit=${{ steps.sccache-cache.outputs.cache-hit }}"
          sccache --show-stats

      - name: Post or update PR comment
        # Fork PRs still run the gate and upload evidence. Their token cannot
        # write comments. Never elevate untrusted benchmark code via target events.
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          BODY_FILE="${{ runner.temp }}/raven-performance/report.md"
          if [ ! -f "$BODY_FILE" ]; then
            BODY_FILE=$(mktemp)
            trap 'rm -f "$BODY_FILE"' EXIT
            printf '%s\n' '<!-- raven-benchmark-comparison -->' '## Benchmark comparison failed' '' 'The job failed before producing a report. Inspect its logs.' > "$BODY_FILE"
          fi
          EXISTING_COMMENT_ID=$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --paginate -q '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- raven-benchmark-comparison -->"))) | .id' \
            | head -1)
          if [ -n "$EXISTING_COMMENT_ID" ]; then
            jq -Rs '{"body": .}' < "$BODY_FILE" | \
              gh api "repos/${REPOSITORY}/issues/comments/${EXISTING_COMMENT_ID}" -X PATCH --input -
          else
            gh pr comment "${PR_NUMBER}" --body-file "$BODY_FILE"
          fi
